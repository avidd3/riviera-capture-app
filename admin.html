<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0d3b29">
<title>Riviera Capture — Admin</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:#0d3b29;color:#f1f3f0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
  header{position:sticky;top:0;background:#0d3b29;border-bottom:1px solid #1f5a3f;padding:14px 20px;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:12px}
  header h1{font-size:18px;margin:0;font-weight:600}
  header .right{display:flex;gap:8px;align-items:center}
  main{padding:20px;max-width:1100px;margin:0 auto}
  section{background:#11432f;border:1px solid #1f5a3f;border-radius:12px;padding:18px;margin-bottom:18px}
  h2{margin:0 0 14px;font-size:13px;font-weight:600;color:#7fb89c;text-transform:uppercase;letter-spacing:.05em}

  /* Login */
  .loginCard{max-width:420px;margin:80px auto;background:#11432f;border:1px solid #1f5a3f;border-radius:14px;padding:28px}
  .loginCard h1{font-size:20px;margin:0 0 6px;font-weight:600}
  .loginCard .sub{color:#7fb89c;font-size:13px;margin-bottom:22px}
  .err{color:#ff9090;background:#3a1010;border:1px solid #5a1f1f;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:14px}

  input[type=text],input[type=password],input[type=email]{
    width:100%;padding:11px 13px;background:#0d3b29;color:#f1f3f0;border:1px solid #2a7c54;
    border-radius:8px;font:inherit;font-size:15px
  }
  input:focus{outline:none;border-color:#3da774}
  button{padding:11px 16px;background:#2a7c54;color:#fff;border:none;border-radius:8px;font:inherit;font-weight:600;cursor:pointer;font-size:14px}
  button:hover{background:#3da774}
  button:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{background:transparent;border:1px solid #2a7c54;color:#7fb89c;font-weight:500}
  button.ghost:hover{background:#1f5a3f;color:#fff}
  button.danger{background:#5a1f1f}
  button.danger:hover{background:#7a2f2f}
  .formRow{display:grid;grid-template-columns:1fr auto;gap:8px}

  /* Captain table */
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #1f5a3f;vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#7fb89c;font-weight:600}
  tr.inactive{opacity:.55}
  td.email{font-weight:600;color:#fff}
  td.url{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#7fb89c;word-break:break-all;max-width:260px}
  td.actions{white-space:nowrap}
  td.actions button{padding:6px 11px;font-size:12px;margin-right:6px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .pill.active{background:#1f5a3f;color:#7fb89c}
  .pill.inactive{background:#5a1f1f;color:#e69090}
  .pill.copied{background:#2a7c54;color:#fff}
  .empty{text-align:center;color:#7fb89c;padding:28px;font-size:13px}

  /* Toast */
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,100px);background:#1f5a3f;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:60;border:1px solid #2a7c54;opacity:0;transition:all .25s ease;pointer-events:none}
  .toast.show{transform:translate(-50%,0);opacity:1}
  .toast.error{background:#7a1f1f;border-color:#a02f2f}
</style>
</head>
<body>

<!-- Login screen -->
<div id="loginView">
  <div class="loginCard">
    <h1>Riviera Capture — Admin</h1>
    <div class="sub">Enter the shared admin secret to manage captain access.</div>
    <div class="err" id="loginErr" style="display:none"></div>
    <form id="loginForm" autocomplete="off">
      <input type="password" id="secretInput" placeholder="Admin secret" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <div style="margin-top:14px"><button type="submit" id="loginBtn" style="width:100%">Sign in</button></div>
    </form>
  </div>
</div>

<!-- Authenticated view -->
<div id="adminView" style="display:none">

<header>
  <h1>Riviera Capture — Admin</h1>
  <div class="right">
    <span id="meta" style="font-size:12px;color:#7fb89c"></span>
    <button class="ghost" id="refreshBtn">Refresh</button>
    <button class="ghost" id="logoutBtn">Sign out</button>
  </div>
</header>

<main>

<section>
  <h2>Add a captain</h2>
  <form id="addCaptainForm" class="formRow">
    <input type="email" id="newEmail" placeholder="captain@example.com" required autocomplete="off">
    <button type="submit" id="addBtn">+ Add captain</button>
  </form>
</section>

<section>
  <h2>Captains</h2>
  <div id="captainsHost"></div>
</section>

</main>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

const SUPABASE_URL = "https://aqcbovokukjafftniunh.supabase.co";
const FUNCTION_URL = SUPABASE_URL + "/functions/v1/riviera-write";
// Captain link base: where the PWA itself is hosted. The token is appended
// as a fragment (#t=...) so iOS PWA install preserves it through the
// manifest's start_url stripping.
const PWA_BASE_URL = location.origin + location.pathname.replace(/admin\.html$/, "");

const SECRET_KEY = "riviera.adminSecret";
let SECRET = sessionStorage.getItem(SECRET_KEY) || localStorage.getItem(SECRET_KEY) || "";

function $(id) { return document.getElementById(id); }
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function captainUrl(token) {
  return PWA_BASE_URL + "#t=" + token;
}
function fmtDate(s) {
  if (!s) return "—";
  try { return new Date(s).toLocaleString(); } catch (_e) { return s; }
}
function fmtRelative(s) {
  if (!s) return "—";
  const ms = Date.now() - new Date(s).getTime();
  const min = Math.round(ms / 60000);
  if (min < 1) return "just now";
  if (min < 60) return min + " min ago";
  const hr = Math.round(min / 60);
  if (hr < 24) return hr + "h ago";
  const d = Math.round(hr / 24);
  return d + "d ago";
}

function toast(msg, isError) {
  const el = $("toast");
  el.textContent = msg;
  el.classList.toggle("error", !!isError);
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 2800);
}

async function rpc(body) {
  const res = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ secret: SECRET, ...body })
  });
  let json;
  try { json = await res.json(); } catch (_e) {
    throw new Error("non-JSON response: HTTP " + res.status);
  }
  if (!res.ok || !json.ok) throw new Error(json.error || ("HTTP " + res.status));
  return json;
}

// ============================================================
// Login
// ============================================================
async function tryLogin(secret) {
  SECRET = secret;
  // Validate by attempting a no-op listCaptains.
  await rpc({ mode: "listCaptains" });
}

$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = $("secretInput").value.trim();
  if (!v) return;
  $("loginBtn").disabled = true;
  $("loginErr").style.display = "none";
  try {
    await tryLogin(v);
    sessionStorage.setItem(SECRET_KEY, v);
    showAdmin();
  } catch (err) {
    $("loginErr").textContent = "Couldn't sign in: " + (err.message || err);
    $("loginErr").style.display = "block";
  } finally {
    $("loginBtn").disabled = false;
  }
});

$("logoutBtn").addEventListener("click", () => {
  SECRET = "";
  sessionStorage.removeItem(SECRET_KEY);
  localStorage.removeItem(SECRET_KEY);
  $("adminView").style.display = "none";
  $("loginView").style.display = "block";
  $("secretInput").value = "";
});

function showAdmin() {
  $("loginView").style.display = "none";
  $("adminView").style.display = "block";
  loadCaptains();
}

// ============================================================
// Captain list + add
// ============================================================
async function loadCaptains() {
  const host = $("captainsHost");
  host.innerHTML = `<div class="empty">Loading…</div>`;
  try {
    const r = await rpc({ mode: "listCaptains" });
    renderCaptains(r.captains || []);
    $("meta").textContent = (r.captains?.length || 0) + " captain(s)";
  } catch (err) {
    host.innerHTML = `<div class="err">Couldn't load: ${escapeHtml(err.message || String(err))}</div>`;
  }
}
$("refreshBtn").addEventListener("click", loadCaptains);

function renderCaptains(captains) {
  const host = $("captainsHost");
  if (!captains.length) {
    host.innerHTML = `<div class="empty">No captains yet — add one above.</div>`;
    return;
  }
  const rows = captains.map(c => {
    const url = captainUrl(c.token);
    const lastSeen = c.last_seen_at ? `${fmtRelative(c.last_seen_at)}` : "never";
    return `
      <tr class="${c.active ? "" : "inactive"}" data-id="${c.id}">
        <td class="email">${escapeHtml(c.email)}</td>
        <td>${fmtDate(c.created_at).split(",")[0]}</td>
        <td title="${escapeHtml(fmtDate(c.last_seen_at))}">${lastSeen}</td>
        <td><span class="pill ${c.active ? "active" : "inactive"}">${c.active ? "active" : "inactive"}</span></td>
        <td class="url">${escapeHtml(url)}</td>
        <td class="actions">
          <button class="ghost" data-act="copy" data-url="${escapeHtml(url)}">Copy URL</button>
          <button class="${c.active ? "ghost" : ""} ${c.active ? "" : ""}" data-act="toggle" data-id="${c.id}" data-active="${!c.active}">${c.active ? "Deactivate" : "Activate"}</button>
        </td>
      </tr>
    `;
  }).join("");
  host.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Email</th>
          <th>Added</th>
          <th>Last seen</th>
          <th>Status</th>
          <th>Captain URL</th>
          <th></th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
  host.querySelectorAll("button[data-act]").forEach(b => {
    b.addEventListener("click", () => {
      const act = b.dataset.act;
      if (act === "copy") {
        const u = b.dataset.url;
        navigator.clipboard.writeText(u).then(() => {
          toast("URL copied");
          b.textContent = "Copied ✓";
          setTimeout(() => { b.textContent = "Copy URL"; }, 1500);
        }).catch(e => toast("Copy failed: " + e.message, true));
      } else if (act === "toggle") {
        const id = b.dataset.id;
        const active = b.dataset.active === "true";
        b.disabled = true;
        rpc({ mode: "setCaptainActive", captainId: id, active })
          .then(() => loadCaptains())
          .catch(err => { toast("Failed: " + err.message, true); b.disabled = false; });
      }
    });
  });
}

$("addCaptainForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = $("newEmail").value.trim().toLowerCase();
  if (!email) return;
  $("addBtn").disabled = true;
  try {
    const r = await rpc({ mode: "createCaptain", email });
    toast("Added " + r.captain.email);
    $("newEmail").value = "";
    await loadCaptains();
    // Auto-copy the new captain's URL
    try {
      await navigator.clipboard.writeText(captainUrl(r.captain.token));
      toast("Added " + r.captain.email + " · URL copied");
    } catch (_e) {}
  } catch (err) {
    toast("Couldn't add: " + (err.message || err), true);
  } finally {
    $("addBtn").disabled = false;
  }
});

// ============================================================
// Boot — auto-login if we have a stored secret
// ============================================================
(async () => {
  if (!SECRET) return;
  try {
    await rpc({ mode: "listCaptains" });
    showAdmin();
  } catch (_e) {
    // Stale secret — show login.
    sessionStorage.removeItem(SECRET_KEY);
    localStorage.removeItem(SECRET_KEY);
    SECRET = "";
  }
})();
</script>

</body>
</html>
